[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indian-markets-mcp"
version = "0.1.0"
description = "MCP server for Indian market and regulatory data from official open sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siddharth Gaur" }]
keywords = ["mcp", "model-context-protocol", "nse", "sebi", "amfi", "india", "finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  # zoneinfo has no system tz database to fall back on for Asia/Kolkata on
  # Windows (and minimal Linux images without tzdata installed); the marker
  # keeps this a no-op on systems that already have one.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
indian-markets-mcp = "indian_markets_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/indian_markets_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real upstream sources (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
